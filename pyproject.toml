[project]
name = "spaces-landing-preview"
version = "0.1.0"
description = "Standalone styling preview of a merged managed-spaces landing + plan picker, in the Cloud in a Bottle look. Not the live site."
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]>=2.8",
    "jinja2>=3.1",
    "attrs>=23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preview"]
